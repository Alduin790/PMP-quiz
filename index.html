<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMP Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e6b73">
<style>
:root{--bg:#eef2f4;--c:#fff;--t:#14212b;--m:#5d6b76;--b:#d3dce2;--ac:#0e6b73;--ok:#1b7a43;--okb:#e1f4e8;--ko:#b3261e;--kob:#fbe6e4;--w:#8a5a00}
@media(prefers-color-scheme:dark){:root{--bg:#10181d;--c:#18232a;--t:#e8eef2;--m:#9bacb8;--b:#2e3d47;--ac:#4fc3cc;--ok:#6fd49a;--okb:#16301f;--ko:#f28b82;--kob:#3a1c1a;--w:#e0b34f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--b);padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
select,input[type=search]{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:6px 8px}
nav button,.btn{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:6px 12px;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:780px;margin:0 auto;padding:14px 14px max(14px,env(safe-area-inset-bottom))}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--b);background:var(--c);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:disabled{color:var(--t);cursor:default}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.ko{background:var(--kob);border-color:var(--ko)}
.opt .ex{display:block;margin-top:6px;font-size:14px;color:var(--m)}
.opt.ok .ex,.opt.ko .ex{color:var(--t)}
.m{color:var(--m);font-size:14px}
.note{color:var(--w);font-size:14px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--b);border-radius:999px;padding:1px 8px;margin-right:4px}
.bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g .card{margin:0}
.big{font-size:26px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details{margin:6px 0}summary{cursor:pointer}
h3{margin:0 0 6px}
</style></head><body>
<header><b>PMP Quiz</b><nav id="nav"></nav></header>
<div id="warn" class="note" style="padding:0 14px"></div>
<main id="app"></main>
<script>
const KB="pmp_bank_v1",KP="pmp_progress_v1";
let BANK=null,mem=false;
let P={att:[],sess:{tab:"new",set:"",amb:"",qid:null,sel:[],done:false,rv:0,dbSet:"",dbQ:"",dbSt:""}};
try{const b=localStorage.getItem(KB);if(b)BANK=JSON.parse(b);const p=localStorage.getItem(KP);if(p)P=Object.assign(P,JSON.parse(p))}catch(e){mem=true}
const save=()=>{try{localStorage.setItem(KP,JSON.stringify(P))}catch(e){mem=true;warn()}};
const saveBank=()=>{try{localStorage.setItem(KB,JSON.stringify(BANK))}catch(e){mem=true;warn()}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- banca domande dal JSON ---------- */
let CACHE=null;
function bank(){
 if(CACHE)return CACHE;
 if(!BANK)return CACHE={sets:[],qs:[],byId:{}};
 const seen={},qs=[];
 BANK.file.forEach(f=>f.domande.forEach(q=>{
  const x=Object.assign({},q,{uid:f.id+"#"+q.id,set:f.id,st:f.titolo,ans:String(q.risposta_corretta).split(",").map(s=>s.trim())});
  x.fp=String(q.domanda).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,120);
  if(seen[x.fp])x.dup=seen[x.fp];else seen[x.fp]=x.uid;
  qs.push(x)}));
 return CACHE={sets:BANK.file,qs,byId:Object.fromEntries(qs.map(x=>[x.uid,x]))}}
const last=id=>{for(let i=P.att.length-1;i>=0;i--)if(P.att[i].id==id)return P.att[i]};
const first=id=>P.att.find(a=>a.id==id);
const isWrong=id=>{const l=last(id);return l&&!l.c};
const status=id=>{const l=last(id);return !l?"nd":l.c?"ok":"ko"};
const filt=q=>!q.dup&&(!P.sess.set||q.set==P.sess.set)&&(!P.sess.amb||q.ambito==P.sess.amb);
function queue(mode){const{qs}=bank(),s=P.sess;
 return mode=="new"?qs.filter(q=>filt(q)&&!first(q.uid))
  :qs.filter(q=>{const l=last(q.uid);return filt(q)&&l&&!l.c&&l.t<s.rv})}

/* ---------- filtri ---------- */
function filters(){const{sets,qs}=bank(),s=P.sess;
 const ambs=[...new Set(qs.filter(q=>!s.set||q.set==s.set).map(q=>q.ambito))].sort();
 return `<div class="row"><select data-a="set"><option value="">Tutti i file</option>${sets.map(x=>`<option value="${esc(x.id)}" ${s.set==x.id?"selected":""}>${esc(x.titolo)} (${x.domande.length})</option>`).join("")}</select>
 <select data-a="amb"><option value="">Tutti gli ambiti</option>${ambs.map(a=>`<option ${s.amb==a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>`}

/* ---------- nuove / ripasso ---------- */
function quizView(mode){
 if(!BANK)return noBank();
 const{qs,byId}=bank(),s=P.sess,Q=queue(mode);
 let q=byId[s.qid];
 if(!(q&&(s.done||Q.includes(q)))){q=Q[0];s.qid=q?q.uid:null;s.sel=[];s.done=false;save()}
 const tot=qs.filter(filt),dn=tot.filter(x=>first(x.uid)).length,wr=tot.filter(x=>isWrong(x.uid)).length;
 let h=`<div class="card">${filters()}<p class="m" style="margin:10px 0 4px">${mode=="new"
  ?`Nuove domande: completate ${dn} su ${tot.length}, ne restano ${Q.length}`
  :`Ripasso: ${wr} domande sbagliate in totale, ${Q.length} ancora da rivedere in questo giro`}</p>
  <div class="bar"><i style="width:${tot.length?dn/tot.length*100:0}%"></i></div>
  ${mode=="rev"?`<p style="margin:8px 0 0"><button class="btn" data-a="rvreset">Ricomincia il giro di ripasso</button></p>`:""}</div>`;
 if(!q)return h+`<div class="card">${mode=="new"?"Hai completato tutte le domande con questi filtri.":"Nessun errore da ripassare in questo giro."}</div>`;
 return h+questionCard(q,mode)}
function questionCard(q,mode){
 const s=P.sess,multi=q.ans.length>1,lq=s.done?last(q.uid):null,keys=Object.keys(q.opzioni);
 let h=`<div class="card"><div class="m">${esc(q.st)} · domanda ${q.id}${q.timestamp?" · video "+esc(q.timestamp):""}</div>
 <div style="margin:6px 0"><span class="tag">${esc(q.ambito)}</span>${multi?`<span class="tag">Scegli ${q.ans.length} risposte</span>`:""}</div>
 <p><b>${esc(q.domanda)}</b></p>`;
 keys.forEach(c=>{let k="opt",ex="";
  if(s.done){const right=q.ans.includes(c),picked=lq.k.includes(c);
   if(right)k+=" ok";else if(picked)k+=" ko";
   const e=q.spiegazioni_opzioni&&q.spiegazioni_opzioni[c];
   ex=`<span class="ex">${picked?"<b>La tua scelta.</b> ":""}${esc(e||"")}</span>`}
  else if(s.sel.includes(c))k+=" sel";
  h+=`<button class="${k}" data-a="sel" data-v="${c}" ${s.done?"disabled":""}><b>${c}.</b> ${esc(q.opzioni[c])}${ex}</button>`});
 if(!s.done){
  h+=`<div class="row"><button class="btn p" data-a="ok" ${s.sel.length==q.ans.length?"":"disabled"}>Conferma</button>
  ${q.hint?`<details style="margin:0"><summary class="m">Suggerimento</summary><p class="m">${esc(q.hint)}</p></details>`:""}</div>`}
 else{
  h+=lq.c?`<p style="color:var(--ok)"><b>Corretta</b></p>`:`<p style="color:var(--ko)"><b>Sbagliata.</b> Risposta corretta: ${q.ans.join(", ")}</p>`;
  if(q.spiegazione)h+=`<p>${esc(q.spiegazione)}</p>`;
  if(q.nota)h+=`<p class="note">Nota: ${esc(q.nota)}</p>`;
  h+=`<button class="btn p" data-a="next">${mode=="db"?"Torna al database":"Prossima domanda"}</button>`}
 return h+"</div>"}
function noBank(){return `<div class="card"><h3>Nessuna domanda caricata</h3><p>Se l'app è online le domande si caricano da sole da <i>domande.json</i>. Altrimenti caricale qui a mano.</p><input type="file" accept=".json" data-a="fbank"></div>`}

/* ---------- database ---------- */
function db(){
 if(!BANK)return noBank();
 const{sets,qs}=bank(),s=P.sess,term=s.dbQ.toLowerCase();
 const list=qs.filter(q=>(!s.dbSet||q.set==s.dbSet)&&(!s.dbSt||status(q.uid)==s.dbSt)&&(!term||(q.domanda+" "+Object.values(q.opzioni).join(" ")).toLowerCase().includes(term)));
 const ic={nd:"○",ok:"✓",ko:"✗"};
 let h=`<div class="card"><div class="row">
 <select data-a="dbSet"><option value="">Tutti i file</option>${sets.map(x=>`<option value="${esc(x.id)}" ${s.dbSet==x.id?"selected":""}>${esc(x.titolo)} (${x.domande.length})</option>`).join("")}</select>
 <select data-a="dbSt"><option value="">Tutti gli stati</option><option value="nd" ${s.dbSt=="nd"?"selected":""}>○ Non fatte</option><option value="ok" ${s.dbSt=="ok"?"selected":""}>✓ Corrette</option><option value="ko" ${s.dbSt=="ko"?"selected":""}>✗ Sbagliate</option></select>
 <input type="search" data-a="dbQ" placeholder="Cerca nel testo..." value="${esc(s.dbQ)}"></div>
 <p class="m" style="margin:8px 0 0">${list.length} domande. Legenda: ○ non fatta, ✓ corretta all'ultimo tentativo, ✗ sbagliata.</p></div>`;
 const show=list.slice(0,300);
 h+=`<div class="card">`+show.map(q=>{
  const l=last(q.uid),n=P.att.filter(a=>a.id==q.uid).length;
  return `<details><summary>${ic[status(q.uid)]} <b>${esc(q.set)} #${q.id}</b> ${esc(q.domanda.slice(0,90))}${q.domanda.length>90?"...":""}</summary>
  <div style="padding:6px 0 10px 18px"><div class="m">${esc(q.ambito)}${q.timestamp?" · video "+esc(q.timestamp):""}${n?` · ${n} tentativi, ultima risposta ${l.k.join(",")}`:""}</div>
  <p>${esc(q.domanda)}</p>${Object.keys(q.opzioni).map(c=>{const r=q.ans.includes(c);
   return `<p style="margin:4px 0">${r?"<b>":""}${c}. ${esc(q.opzioni[c])}${r?" ✓</b>":""}<br><span class="m">${esc((q.spiegazioni_opzioni||{})[c]||"")}</span></p>`}).join("")}
  ${q.spiegazione?`<p>${esc(q.spiegazione)}</p>`:""}${q.nota?`<p class="note">${esc(q.nota)}</p>`:""}
  ${q.dup?`<p class="note">Duplicato di ${esc(q.dup)}: non viene riproposta nei quiz.</p>`:""}
  <button class="btn" data-a="practice" data-v="${esc(q.uid)}">Rispondi a questa domanda</button></div></details>`}).join("")
  +(list.length>300?`<p class="m">Mostrate le prime 300: usa i filtri o la ricerca per restringere.</p>`:"")+`</div>`;
 return h}
function practiceView(){const q=bank().byId[P.sess.qid];if(!q)return "";return `<p><button class="btn" data-a="tab" data-v="db">← Torna al database</button></p>`+questionCard(q,"db")}

/* ---------- statistiche ---------- */
function stats(){
 if(!BANK)return noBank();
 const{sets,qs}=bank(),U=qs.filter(x=>!x.dup),F=U.filter(x=>first(x.uid)),ok=F.filter(x=>first(x.uid).c).length,W=U.filter(x=>isWrong(x.uid));
 const st=(n,l)=>`<div class="card"><div class="big">${n}</div><div class="m">${l}</div></div>`;
 let h=`<div class="g" style="margin-bottom:12px">${st(F.length+" / "+U.length,"Domande fatte")}${st(F.length?Math.round(ok/F.length*100)+"%":"-","Corrette al 1° tentativo")}${st(W.length,"Da ripassare")}${st(P.att.length,"Risposte totali")}</div>`;
 h+=`<div class="card"><b>Per file</b>${sets.map(s=>{const u=U.filter(x=>x.set==s.id),d=u.filter(x=>first(x.uid)),c=d.filter(x=>first(x.uid).c).length;
  return `<p style="margin:10px 0 4px">${esc(s.titolo)} <span class="m">${d.length}/${u.length}${d.length?", "+Math.round(c/d.length*100)+"% corrette":""}</span></p><div class="bar"><i style="width:${u.length?d.length/u.length*100:0}%"></i></div>`}).join("")}</div>`;
 const A={};F.forEach(x=>{const a=A[x.ambito]=A[x.ambito]||[0,0];a[0]++;if(!isWrong(x.uid))a[1]++});
 h+=`<div class="card"><b>Per ambito (ultima risposta corretta)</b>${Object.entries(A).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0]).map(([k,v])=>`<p style="margin:10px 0 4px">${esc(k)} <span class="m">${v[1]}/${v[0]} · ${Math.round(v[1]/v[0]*100)}%</span></p><div class="bar"><i style="width:${v[1]/v[0]*100}%"></i></div>`).join("")||'<p class="m">Nessuna risposta ancora.</p>'}</div>`;
 const days={};P.att.forEach(a=>{const d=new Date(a.t).toLocaleDateString("it-IT"),x=days[d]=days[d]||[0,0];x[0]++;if(a.c)x[1]++});
 h+=`<div class="card"><b>Storico per giorno</b>${Object.entries(days).reverse().slice(0,14).map(([d,v])=>`<p style="margin:10px 0 4px">${d} <span class="m">${v[0]} risposte, ${Math.round(v[1]/v[0]*100)}% corrette</span></p><div class="bar"><i style="width:${v[1]/v[0]*100}%"></i></div>`).join("")||'<p class="m">Nessuna risposta ancora.</p>'}</div>`;
 return h}

/* ---------- dati e backup ---------- */
function data(){
 const info=BANK?`Caricata versione <b>${esc(BANK.versione)}</b>: ${BANK.file.length} file, ${bank().qs.length} domande.`:"Nessun file caricato.";
 return `<div class="card"><h3>Domande (JSON)</h3><p class="m">${info} Online l'app scarica da sola le versioni più recenti di domande.json. Puoi anche caricare un file a mano: i progressi restano.</p><input type="file" accept=".json" data-a="fbank"></div>
<div class="card"><h3>Backup progressi</h3><p class="m">I progressi sono salvati sul dispositivo. Esporta un backup ogni tanto: se cambi dispositivo o cancelli l'app lo reimporti qui.</p>
<button class="btn p" data-a="exp">Esporta backup</button><p><label>Importa backup: <input type="file" accept=".json" data-a="fbk"></label></p></div>
<div class="card"><h3>Azzera progressi</h3><p class="m">Cancella lo storico delle risposte. Le domande restano.</p><button class="btn" data-a="rst">Azzera storico</button></div>`}

function readFile(t,cb){const f=t.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){alert("File non valido: "+e.message)}t.value=""};r.readAsText(f)}
function loadBank(j){if(!j||!Array.isArray(j.file)||!j.file.every(f=>f.id&&Array.isArray(f.domande)))throw new Error("non è un file domande (manca 'file' con 'domande')");
 BANK=j;CACHE=null;saveBank();P.sess.qid=null;P.sess.done=false;save();
 alert(`Caricate ${bank().qs.length} domande da ${j.file.length} file.`);render()}
function loadBk(j){if(!Array.isArray(j.att)||!j.sess)throw new Error("backup non riconosciuto");
 P=Object.assign({att:[],sess:{}},j);P.sess=Object.assign({tab:"new",set:"",amb:"",qid:null,sel:[],done:false,rv:0,dbSet:"",dbQ:"",dbSt:""},j.sess);
 save();alert(`Backup importato: ${P.att.length} risposte.`);render()}

/* ---------- azioni ---------- */
function act(a,v){const s=P.sess,reset=()=>{s.qid=null;s.sel=[];s.done=false};
 if(a=="tab"){if(s.done||s.tab=="practice")reset();if(v=="rev"&&s.tab!="rev")s.rv=Date.now();s.tab=v}
 else if(a=="set"){s.set=v;s.amb="";reset()}
 else if(a=="amb"){s.amb=v;reset()}
 else if(a=="sel"&&!s.done){const q=bank().byId[s.qid];if(q.ans.length>1){s.sel=s.sel.includes(v)?s.sel.filter(x=>x!=v):s.sel.length<q.ans.length?s.sel.concat(v):s.sel}else s.sel=[v]}
 else if(a=="ok"&&!s.done){const q=bank().byId[s.qid],k=[...s.sel].sort(),c=k.join()==[...q.ans].sort().join();
  P.att.push({id:q.uid,k,c,t:Date.now(),m:s.tab});s.done=true}
 else if(a=="next"){reset();if(s.tab=="practice")s.tab="db"}
 else if(a=="rvreset"){s.rv=Date.now();reset()}
 else if(a=="practice"){s.tab="practice";s.qid=v;s.sel=[];s.done=false}
 else if(a=="exp"){exportBackup();return}
 else if(a=="rst"){if(!confirm("Cancellare tutto lo storico delle risposte?"))return;P.att=[];reset()}
 save();render();if(["tab","next","practice"].includes(a))scrollTo(0,0)}
async function exportBackup(){
 const name="pmp-quiz-backup-"+new Date().toISOString().slice(0,10)+".json";
 const txt=JSON.stringify(Object.assign({tipo:"pmp-quiz-backup",versione_domande:BANK&&BANK.versione,data:new Date().toISOString()},P));
 const file=new File([txt],name,{type:"application/json"});
 /* su iPad apre il menu Condividi: scegli "Salva in File" */
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name=="AbortError")return}}
 const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||/SELECT|INPUT/.test(b.tagName)||b.disabled)return;act(b.dataset.a,b.dataset.v)});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;
 if(a=="set"||a=="amb")act(a,t.value);
 else if(a=="dbSet"||a=="dbSt"){P.sess[a]=t.value;save();render()}
 else if(a=="fbank")readFile(t,loadBank);else if(a=="fbk")readFile(t,loadBk)});
let tmr;document.addEventListener("input",e=>{if(e.target.dataset.a=="dbQ"){clearTimeout(tmr);tmr=setTimeout(()=>{P.sess.dbQ=e.target.value;save();const pos=e.target.selectionStart;render();const i=document.querySelector('[data-a="dbQ"]');i.focus();i.setSelectionRange(pos,pos)},300)}});

const TABS=[["new","Nuove domande"],["rev","Ripasso errori"],["db","Database"],["stats","Statistiche"],["data","Dati e backup"]];
function warn(){$("warn").textContent=mem?"Salvataggio non disponibile: esporta spesso il backup.":""}
function render(){const t=P.sess.tab;
 $("nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==t||(t=="practice"&&k=="db")?"on":""}" data-a="tab" data-v="${k}">${n}</button>`).join("");
 $("app").innerHTML=t=="new"?quizView("new"):t=="rev"?quizView("rev"):t=="db"?db():t=="practice"?practiceView():t=="stats"?stats():data();warn()}

/* online: scarica domande.json e lo aggiorna se la versione è più recente; registra il service worker per l'uso offline */
if(location.protocol.startsWith("http")){
 fetch("domande.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
  if(j&&Array.isArray(j.file)&&(!BANK||Number(j.versione)>Number(BANK.versione))){BANK=j;CACHE=null;saveBank();render()}}).catch(()=>{});
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
</script></body></html>
